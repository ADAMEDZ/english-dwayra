<script>
// ===================== CONFIG =====================
const C={app:'B.L.U.E.',full:'Broadlearning Universal Education',minV:3,passTh:0.8,adRW:0.7,adRVW:0.3,minRev:5};

// ===================== UTILS =====================
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const da=n=>{const d=new Date();d.setDate(d.getDate()-n);return d.toISOString()};
const esc=s=>{const d=document.createElement('div');d.textContent=s;return d.innerHTML};
const cl=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));

function toast(m,t='info'){const c=document.getElementById('tc');const cs={info:'border-l-4 border-cyan-500',success:'border-l-4 border-emerald-500',error:'border-l-4 border-red-500',warning:'border-l-4 border-amber-500'};const ic={info:'fa-info-circle text-cyan-400',success:'fa-check-circle text-emerald-400',error:'fa-exclamation-circle text-red-400',warning:'fa-exclamation-triangle text-amber-400'};const e=document.createElement('div');e.className=`toast ${cs[t]} rounded-lg px-4 py-3 flex items-start gap-3 shadow-xl`;e.style.cssText='background:var(--card);color:var(--fg)';e.innerHTML=`<i class="fas ${ic[t]} mt-0.5"></i><span class="text-sm">${m}</span>`;c.appendChild(e);setTimeout(()=>e.remove(),3000)}

function showModal(h){const m=document.getElementById('mdc');m.innerHTML=`<div class="mo fixed inset-0 flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()"><div class="rounded-xl shadow-2xl max-w-lg w-full max-h-[85vh] overflow-y-auto" style="background:var(--card);border:1px solid var(--brd)">${h}</div></div>`;m.classList.remove('hidden')}
function closeModal(){const m=document.getElementById('mdc');m.classList.add('hidden');m.innerHTML=''}

// ===================== FREE API SERVICES =====================
// All these APIs are free, require no API key, and support CORS

const API = {
  // Wikipedia Search API - free, no key, CORS enabled
  async wikipedia(query, limit=5) {
    try {
      const url = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&srlimit=${limit}&format=json&origin=*`;
      const r = await fetch(url);
      const d = await r.json();
      return (d.query?.search||[]).map(r=>({
        source:'wikipedia',
        id:`wiki_${r.pageid}`,
        title:r.title,
        snippet:r.snippet.replace(/<[^>]+>/g,''),
        url:`https://en.wikipedia.org/wiki/${encodeURIComponent(r.title.replace(/ /g,'_'))}`,
        icon:'fa-brands fa-wikipedia-w',
        iconColor:'#636466',
        type:'Encyclopedia Article',
        pageid:r.pageid
      }));
    } catch(e) { console.warn('Wikipedia API error:',e); return []; }
  },

  // Wikipedia page summary - free, no key, CORS enabled
  async wikiSummary(title) {
    try {
      const url = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
      const r = await fetch(url);
      const d = await r.json();
      return { title:d.title, extract:d.extract, thumbnail:d.thumbnail?.source, url:d.content_urls?.desktop?.page };
    } catch(e) { return null; }
  },

  // Open Library API - free, no key, CORS enabled
  async openLibrary(query, limit=6) {
    try {
      const url = `https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=${limit}&fields=title,author_name,cover_i,first_publish_year,key,isbn,subject`;
      const r = await fetch(url);
      const d = await r.json();
      return (d.docs||[]).map(b=>({
        source:'openlibrary',
        id:`ol_${b.key}`,
        title:b.title,
        snippet:b.author_name?`By ${b.author_name.slice(0,2).join(', ')}${b.author_name.length>2?' et al':''}${b.first_publish_year?` (${b.first_publish_year})`:''}`:'',
        url:`https://openlibrary.org${b.key}`,
        cover:b.cover_i?`https://covers.openlibrary.org/b/id/${b.cover_i}-M.jpg`:null,
        icon:'fa-solid fa-book',
        iconColor:'#D97706',
        type:'Free Book / Textbook',
        year:b.first_publish_year,
        authors:b.author_name
      }));
    } catch(e) { console.warn('Open Library API error:',e); return []; }
  },

  // Semantic Scholar API - free, no key, CORS enabled
  async semanticScholar(query, limit=5) {
    try {
      const url = `https://api.semanticscholar.org/graph/v1/paper/search?query=${encodeURIComponent(query)}&limit=${limit}&fields=title,year,authors,url,abstract,citationCount,openAccessPdf,fieldsOfStudy`;
      const r = await fetch(url);
      const d = await r.json();
      return (d.data||[]).map(p=>({
        source:'semanticscholar',
        id:`ss_${p.paperId}`,
        title:p.title,
        snippet:p.abstract?p.abstract.slice(0,200)+'...':(p.authors?.map(a=>a.name).join(', ')||''),
        url:p.url||`https://www.semanticscholar.org/paper/${p.paperId}`,
        pdf:p.openAccessPdf?.url||null,
        icon:'fa-solid fa-graduation-cap',
        iconColor:'#7C3AED',
        type:'Research Paper',
        year:p.year,
        citations:p.citationCount,
        fields:p.fieldsOfStudy
      }));
    } catch(e) { console.warn('Semantic Scholar API error:',e); return []; }
  },

  // DOAJ API - free, no key, CORS enabled
  async doaj(query, limit=5) {
    try {
      const url = `https://doaj.org/api/search/articles/${encodeURIComponent(query)}?page=1&pageSize=${limit}`;
      const r = await fetch(url);
      const d = await r.json();
      return (d.results||[]).map(a=>({
        source:'doaj',
        id:`doaj_${a.id}`,
        title:a.bibjson?.title||'Untitled',
        snippet:a.bibjson?.abstract?.slice(0,200)+'...'||a.bibjson?.journal?.title||'',
        url:a.bibjson?.link?.[0]?.url||'#',
        icon:'fa-solid fa-file-lines',
        iconColor:'#0891B2',
        type:'Open Access Article',
        year:a.bibjson?.year,
        journal:a.bibjson?.journal?.title
      }));
    } catch(e) { console.warn('DOAJ API error:',e); return []; }
  },

  // Crossref API - free, no key, CORS enabled
  async crossref(query, limit=5) {
    try {
      const url = `https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=${limit}&filter=has-full-text:true`;
      const r = await fetch(url);
      const d = await r.json();
      return (d.message?.items||[]).map(p=>({
        source:'crossref',
        id:`cr_${p.DOI||uid()}`,
        title:p.title?.[0]||'Untitled',
        snippet:p.abstract?p.abstract.replace(/<[^>]+>/g,'').slice(0,200)+'...':(p.author?.map(a=>a.given+' '+a.family).join(', ')||''),
        url:p.URL||(`https://doi.org/${p.DOI}`),
        icon:'fa-solid fa-newspaper',
        iconColor:'#EC4899',
        type:'Academic Paper (Crossref)',
        year:p.published?.['date-parts']?.[0]?.[0],
        doi:p.DOI
      }));
    } catch(e) { console.warn('Crossref API error:',e); return []; }
  },

  // Search all sources in parallel
  async searchAll(query, sources=['wikipedia','openlibrary','semanticscholar','doaj','crossref']) {
    const fns = {
      wikipedia: ()=>this.wikipedia(query),
      openlibrary: ()=>this.openLibrary(query),
      semanticscholar: ()=>this.semanticScholar(query),
      doaj: ()=>this.doaj(query),
      crossref: ()=>this.crossref(query),
    };
    const promises = sources.map(s=>fns[s]?.()||Promise.resolve([]));
    const results = await Promise.allSettled(promises);
    const merged = {};
    sources.forEach((s,i)=>{
      merged[s] = results[i].status==='fulfilled'?results[i].value:[];
    });
    return merged;
  }
};

// ===================== DATA STORE =====================
class DB{
constructor(){this.load();if(!this.d.users.length)this.seed()}
load(){const r=localStorage.getItem('blue_data');this.d=r?JSON.parse(r):{users:[],domains:[],guides:[],prereqs:[],verifs:[],votes:[],listings:[],ratings:[],certs:[]}}

this.d.users=[

{id:'d4a',name:'First Aid',icon:'fa-kit-medical',color:'#DC2626',pid:'d4'},
{id:'d4b',name:'Anatomy',icon:'fa-bone',color:'#DC2626',pid:'d4'}
];
this.d.guides=[
{id:'g1',title:'How to Use a Soldering Iron',did:'d1',sid:'d1b',lv:1,st:'verified',aid:'u2',ed:1,
out:['Safely operate a soldering iron','Create clean solder joints on through-hole components'],
mat:['Soldering iron (25-60W)','60/40 rosin-core solder','Soldering stand','Damp sponge','Safety glasses'],
safe:['Always use in a well-ventilated area','Never touch the iron tip — exceeds 350°C','Keep flammable materials away','Unplug when not in use'],
cnt:`## Introduction\nSoldering is the fundamental skill in electronics that joins two metal surfaces using a filler metal. Every circuit you'll ever build starts here.\n\n## Step 1: Prepare Your Workspace\nEnsure adequate ventilation. Place your soldering iron in its stand on a heat-resistant surface. Wet the cleaning sponge.\n\n> **Safety First**: Solder contains lead. Wash your hands after every session.\n\n## Step 2: Heat the Iron\nPlug in and wait 2-3 minutes. A properly heated iron melts solder instantly on contact.\n\n## Step 3: Tin the Tip\nApply a small amount of solder to the hot tip. This improves heat transfer and protects from oxidation. Wipe excess on the damp sponge.\n\n## Step 4: Prepare the Joint\nStrip about 5mm of insulation. Bend leads slightly to hold components in place.\n\n## Step 5: Apply Heat, Then Solder\nIron touches the joint first, then feed solder into the joint. Hold 2-3 seconds until solder flows smoothly.\n\n## Step 6: Inspect the Joint\nA good joint is shiny, smooth, cone-shaped. No cold joints (grey, cracked, blobby).\n\n<div class="wb"><strong>Common Mistake:</strong> Too much solder creates bridges. Use solder wick to remove excess.</div>\n\n## Step 7: Clean Up\nTrim leads with flush cutters. Wipe tip, re-tin, return to stand. Unplug.`,
nx:['g4','g5'],sat:da(180),vat:da(172)},

{id:'g2',title:'How to Read a Circuit Diagram',did:'d1',sid:'d1b',lv:1,st:'verified',aid:'u2',ed:1,
out:['Identify common schematic symbols','Trace current flow through a circuit','Distinguish series from parallel connections'],
mat:['Circuit diagram reference sheet','Pencil and paper'],safe:[],
cnt:`## Introduction\nCircuit diagrams are the language of electronics. Before building anything, you must read this visual language.\n\n## Step 1: Basic Symbols\n- **Resistor**: Zigzag (US) or rectangle (IEC)\n- **Capacitor**: Two parallel lines\n- **Diode**: Triangle with line\n- **Transistor**: Circle with B, C, E\n- **Ground**: Three decreasing lines\n- **Power (VCC)**: Arrow up or voltage label\n\n## Step 2: Follow the Lines\nLines = wires. Dot at intersection = connected. Cross without dot = NOT connected.\n\n## Step 3: Read the Values\nComponents labeled with designators (R1, C2) and values (10kΩ, 100nF).\n\n## Step 4: Identify Current Flow\nConventional current: VCC → through circuit → ground. Trace with your finger.\n\n## Step 5: Recognize Common Patterns\n- **Voltage divider**: Two resistors in series\n- **RC filter**: Resistor + capacitor\n- **LED circuit**: LED + current-limiting resistor`,
nx:['g4','g5'],sat:da(175),vat:da(168)},

{id:'g3',title:'How to Use a Multimeter',did:'d1',sid:'d1b',lv:1,st:'verified',aid:'u2',ed:1,
out:['Measure voltage, current, and resistance','Test continuity','Safely select correct measurement mode'],
mat:['Digital multimeter','9V battery','Various resistors','Test leads'],
safe:['Never measure resistance on a powered circuit','Never measure mains voltage without training','Always return to OFF after use'],
cnt:`## Introduction\nA multimeter measures voltage, current, and resistance — the three fundamental electrical properties.\n\n## Step 1: Know Your Meter\nDisplay, selector dial, ports: COM (black), VΩmA (red), 10A (red for large current).\n\n## Step 2: Measure DC Voltage\n1. Set dial to DCV at range higher than expected\n2. Black to COM, red to VΩmA\n3. Touch probes across component (parallel)\n\n## Step 3: Measure Resistance\n1. Power off circuit first\n2. Set dial to Ω\n3. Touch probes across component\n\n## Step 4: Measure Current\n1. Set dial to DCA\n2. Break circuit, connect meter in series\n\n## Step 5: Test Continuity\n1. Set to continuity symbol\n2. Touch probes to both ends\n3. Beep = good connection`,
nx:['g5'],sat:da(170),vat:da(162)},

{id:'g4',title:'Build a Basic Transistor Switch',did:'d1',sid:'d1b',lv:2,st:'verified',aid:'u2',ed:1,
out:['Use a BJT as an electronic switch','Calculate base resistor values','Control a high-current load with a low-current signal'],
mat:['2N2222 NPN transistor','LED','330Ω resistor','1kΩ resistor','9V battery + clip','Breadboard'],
safe:['Transistors can get hot if overloaded'],
cnt:`## Introduction\nA transistor switch is the building block of all digital electronics — small current controls larger one.\n\n## Step 1: Understand the BJT\nNPN has Base, Collector, Emitter. Small base current → large collector current.\n\n## Step 2: Build the Circuit\n1. Place 2N2222 flat side facing you\n2. Emitter to Ground\n3. LED + 330Ω between 9V and Collector\n4. 1kΩ between Base and control signal\n\n## Step 3: Test\nPress button → LED ON. Release → LED OFF.\n\n## Step 4: Calculate Base Resistor\nI_base = I_collector / hFE = 20mA/100 = 0.2mA\nR_base = (9V - 0.7V)/0.2mA ≈ 41kΩ\nWe use 1kΩ for strong drive (saturated).`,
nx:['g6','g7'],sat:da(150),vat:da(140)},

{id:'g5',title:'Wire a DC Power Supply',did:'d1',sid:'d1b',lv:2,st:'verified',aid:'u5',ed:1,
out:['Convert AC to stable DC','Size a filter capacitor','Build a regulated 5V supply'],
mat:['9V AC transformer','4x 1N4007 diodes','1000µF capacitor','LM7805 regulator','0.1µF capacitor','Breadboard'],
safe:['Mains voltage on transformer primary — NEVER work on live mains','Insulate all AC connections'],
cnt:`## Introduction\nEvery electronics project needs power. Build a stable 5V DC supply.\n\n## Step 1: AC to Pulsating DC\nFour 1N4007 diodes in bridge configuration. Converts both AC halves to pulsating DC.\n\n## Step 2: Smooth with Capacitor\n1000µF electrolytic across DC output. Charges at peaks, discharges at valleys.\n\n## Step 3: Regulate with LM7805\nFeed smoothed DC into LM7805. Add 0.1µF on input and output for stability.\n\nOutput: rock-solid 5V ±0.2V.`,
nx:['g7'],sat:da(140),vat:da(128)},

{id:'g6',title:'Build a Logic Gate from Transistors',did:'d1',sid:'d1b',lv:3,st:'verified',aid:'u2',ed:1,
out:['Construct NAND and NOR gates from transistors','Understand Boolean logic at hardware level'],
mat:['6x 2N2222 transistors','Resistors and LEDs','Breadboard','5V supply'],
safe:[],
cnt:`## Introduction\nEvery computer operation reduces to logic gates. Build fundamental gates from discrete transistors.\n\n## Step 1: NAND Gate\nTwo NPN in series. Output LOW only when ALL inputs HIGH.\n\n## Step 2: NOR Gate\nTwo NPN in parallel. Output HIGH only when ALL inputs LOW.\n\n## Step 3: Verify Truth Tables\nNAND: 00→1, 01→1, 10→1, 11→0\nNOR: 00→1, 01→0, 10→0, 11→0\n\n## Step 4: Chain Gates\nTwo NAND gates with feedback = flip-flop — the basis of memory.`,
nx:['g8'],sat:da(120),vat:da(108)},

{id:'g7',title:'Build a Basic Audio Amplifier',did:'d1',sid:'d1c',lv:3,st:'under_review',aid:'u5',ed:1,
out:['Amplify audio signals using transistors','Bias a transistor for linear amplification'],
mat:['2N2222 transistor','Resistors and capacitors','8Ω speaker','3.5mm audio jack','Breadboard'],
safe:['Keep volume low — amplified audio can damage hearing'],
cnt:`## Introduction\nBuild a single-stage common-emitter amplifier to drive a small speaker.\n\n## Step 1: Bias the Transistor\nSet V_collector ≈ VCC/2 = 2.5V. Voltage divider on base, emitter resistor for stability.\n\n## Step 2: Add Coupling Capacitors\nInput cap blocks DC from source. Output cap blocks DC from speaker. Emitter bypass cap increases AC gain.\n\n## Step 3: Connect Speaker\n8Ω speaker through output coupling cap. Simple Class-A amplifier.\n\n## Expected Gain\nVoltage gain ≈ R_collector/R_emitter ≈ 10 (without bypass)`,
nx:['g8'],sat:da(7),vat:null},

{id:'g9',title:'How to Properly Hold and Use a Chef\'s Knife',did:'d2',sid:'d2b',lv:1,st:'verified',aid:'u3',ed:1,
out:['Hold a chef\'s knife with proper grip','Perform the rocking cut technique'],
mat:['8-inch chef\'s knife','Cutting board','Vegetables for practice'],
safe:['Always cut away from your body','Keep knives sharp','Never catch a falling knife','Use the claw grip'],
cnt:`## Introduction\nKnife skills are the foundation of all cooking.\n\n## Step 1: The Pinch Grip\nPinch the blade heel between thumb and index finger, then wrap remaining fingers around handle.\n\n## Step 2: The Claw Hand\nCurl fingertips inward. Knuckles act as guide. Knife blade rests against knuckles.\n\n## Step 3: The Rocking Cut\nKeep tip on board. Lift heel, push forward, bring down in rocking motion.\n\n## Practice\nStart slow with celery or carrots. Focus on consistency, not speed.`,
nx:['g10','g11'],sat:da(160),vat:da(150)},

{id:'g10',title:'Understanding Heat: Boiling, Simmering, and Searing',did:'d2',sid:'d2b',lv:1,st:'verified',aid:'u3',ed:1,
out:['Distinguish between heat levels','Apply correct technique to different foods'],
mat:['Stove','Pots and pans','Thermometer','Water and oil'],
safe:['Oil at searing temperatures can cause severe burns','Never add water to hot oil'],
cnt:`## Introduction\nHeat control is the most important cooking skill.\n\n## Boiling (100°C)\nLarge, vigorous bubbles. Pasta, blanching, eggs.\n\n## Simmering (85-95°C)\nGentle, occasional bubbles. Soups, stews, braises.\n\n## Searing (200-260°C)\nMaillard reaction — browning creates flavor. Steaks, stir-fries.\n\n## The Visual Test\n- Boiling: can't see bottom through bubbles\n- Simmering: can see bottom between bubbles\n- Searing: water skitters in beads (Leidenfrost)`,
nx:['g11'],sat:da(155),vat:da(145)},

{id:'g11',title:'Make a Classic French Roux',did:'d2',sid:'d2b',lv:2,st:'verified',aid:'u3',ed:1,
out:['Make white, blond, and brown roux','Use roux to thicken sauces'],
mat:['Butter (unsalted)','All-purpose flour','Whisk','Heavy-bottomed saucepan'],
safe:['Brown roux reaches 150°C+ — can cause serious burns'],
cnt:`## Introduction\nEqual parts fat and flour, cooked together — foundation of French sauces.\n\n## Step 1: Measure Equal Parts by Weight\n50g butter + 50g flour for ~500ml liquid.\n\n## Step 2: Melt and Add Flour\nMelt butter, add flour all at once, whisk to paste.\n\n## Step 3: Cook to Desired Stage\n- White (2 min): pale, raw flour smell\n- Blond (5 min): golden, nutty\n- Brown (15-20 min): deep brown, strong nutty scent\n\n## Step 4: Add Liquid Gradually\nCold/room-temp liquid into hot roux. Never hot into hot.`,
nx:[],sat:da(130),vat:da(118)},

{id:'g12',title:'How to Safely Use Power Tools',did:'d3',sid:'d3a',lv:1,st:'verified',aid:'u4',ed:1,
out:['Operate circular saw, drill, and sander safely','Choose correct blade/bit for material'],
mat:['Circular saw','Power drill','Orbital sander','Safety glasses','Hearing protection','Clamps'],
safe:['ALWAYS wear safety glasses','Never remove blade guards','Disconnect power before changing blades','Keep fingers 6+ inches from blade'],
cnt:`## Introduction\nPower tools demand respect. Three common tools and universal safety principles.\n\n## Universal Safety Rules\n1. Safety glasses, hearing protection, dust protection\n2. Read the manual\n3. Clean, well-lit work area\n4. Clamp your workpiece\n5. Disconnect when changing accessories\n\n## Circular Saw\nSet blade 5mm deeper than material. Full speed before cutting.\n\n## Power Drill\nCorrect bit for material. Use clutch to avoid stripping.\n\n## Orbital Sander\nMove with grain. Don't press. Progress through grits: 80→120→220.`,
nx:['g13'],sat:da(100),vat:da(88)},

{id:'g13',title:'Frame a Basic Interior Wall',did:'d3',sid:'d3a',lv:2,st:'verified',aid:'u4',ed:1,

radio" name="st" value="under_review" ${ss==='under_review'?'checked':''} onchange="upB()">Under Review</label><label class="flex items-center gap-2 text-xs cursor-pointer" style="color:var(--fgm)"><input type="radio" name="st" value="all" ${ss==='all'?'checked':''} onchange="upB()">All</label></div></div></div><div class="flex-1"><p class="text-xs mb-3" style="color:var(--fgm)">${gs.length} guide${gs.length!==1?'s':''}</p><div id="br" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4">${gs.map(g=>gCard(g)).join('')}</div>${gs.length===0?'<div class="text-center py-12" style="color:var(--fgm)"><i class="fas fa-search text-2xl mb-2 block" style="color:var(--brd)"></i><p class="text-sm">No guides match.</p></div>':''}</div></div></div>`}

async function doSearch(){
  const q=document.getElementById('disc-q')?.value?.trim();
  if(!q){toast('Enter a search term','warning');return}
  const srcs=[...document.querySelectorAll('.src-check:checked')].map(c=>c.value);
  if(!srcs.length){toast('Select at least one source','warning');return}

  const rc=document.getElementById('disc-results');
  const sc=document.getElementById('disc-sources');
  if(sc)sc.style.display='none';

  // Show loading skeleton
  rc.innerHTML=`<div class="space-y-4">${srcs.map(s=>`<div class="rounded-xl p-5" style="background:var(--card);border:1px solid var(--brd)"><div class="flex items-center gap-2 mb-3"><div class="w-4 h-4 rounded skel"></div><div class="w-32 h-4 rounded skel"></div><div class="ml-auto w-16 h-4 rounded skel"></div></div><div class="space-y-2"><div class="w-full h-4 rounded skel"></div><div class="w-3/4 h-4 rounded skel"></div><div class="w-5/6 h-4 rounded skel"></div></div></div>`).join('')}</div>`;

  try {
    const results = await API.searchAll(q, srcs);
    renderSearchResults(results, q);
  } catch(e) {
    rc.innerHTML=`<div class="text-center py-10"><i class="fas fa-exclamation-triangle text-2xl mb-2" style="color:var(--err)"></i><p class="text-sm" style="color:var(--fgm)">Search failed. Please try again.</p></div>`;
  }
}

function renderSearchResults(results, query){
  const rc=document.getElementById('disc-results');
  const srcMeta={
    wikipedia:{name:'Wikipedia',icon:'fa-brands fa-wikipedia-w',color:'#636466'},
    openlibrary:{name:'Open Library',icon:'fa-solid fa-book',color:'#D97706'},
    semanticscholar:{name:'Semantic Scholar',icon:'fa-solid fa-graduation-cap',color:'#7C3AED'},
    doaj:{name:'DOAJ',icon:'fa-solid fa-file-lines',color:'#0891B2'},
    crossref:{name:'Crossref',icon:'fa-solid fa-newspaper',color:'#EC4899'}
  };

  let totalResults = 0;
  Object.values(results).forEach(r=>totalResults+=r.length);

  let html = `<div class="flex items-center justify-between mb-4">
    <p class="text-xs" style="color:var(--fgm)">Found ${totalResults} resources for "<strong style="color:var(--fg)">${esc(query)}</strong>"</p>
    <button onclick="document.getElementById('disc-sources').style.display='';document.getElementById('disc-results').innerHTML=''" class="text-xs fd font-medium" style="color:var(--acc)">New Search</button>
  </div>`;

  for (const [source, items] of Object.entries(results)) {
    const m = srcMeta[source];
    if (!m) continue;

    html += `<div class="mb-5">
      <div class="flex items-center gap-2 mb-3"><i class="${m.icon}" style="color:${m.color}"></i><h2 class="fd font-bold text-sm" style="color:var(--fg)">${m.name}</h2><span class="text-[10px] px-2 py-0.5 rounded-full" style="background:var(--bg3);color:var(--fgm)">${items.length} results</span></div>`;

    if (items.length === 0) {
      html += `<p class="text-xs italic" style="color:var(--fgm)">No results found in ${m.name}.</p>`;
    } else {
      html += `<div class="space-y-2">`;
      items.forEach(item => {
        html += `<a href="${item.url}" target="_blank" rel="noopener" class="block p-3 rounded-lg rc" style="background:var(--card);border:1px solid var(--brd)">
          <div class="flex gap-3">
            ${item.cover?`<img src="${item.cover}" alt="" class="w-12 h-16 object-cover rounded flex-shrink-0" onerror="this.style.display='none'">`:''}
            <div class="min-w-0 flex-1">
              <h3 class="fd font-semibold text-sm leading-snug mb-0.5" style="color:var(--fg)">${esc(item.title)}</h3>
              <p class="text-[11px] leading-relaxed mb-1" style="color:var(--fgm)">${esc(item.snippet||'')}</p>
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-[10px] px-1.5 py-0.5 rounded" style="background:${m.color}18;color:${m.color}">${item.type||m.name}</span>
                ${item.year?`<span class="text-[10px]" style="color:var(--fgm)">${item.year}</span>`:''}
                ${item.citations!==undefined?`<span class="text-[10px]" style="color:var(--fgm)"><i class="fas fa-quote-left text-[8px]"></i> ${item.citations} citations</span>`:''}
                ${item.pdf?`<span class="text-[10px]" style="color:var(--ok)"><i class="fas fa-file-pdf"></i> Open PDF</span>`:''}
              </div>
            </div>
            <i class="fas fa-external-link-alt text-[10px] flex-shrink-0 mt-1" style="color:var(--fgm)"></i>
          </div>
        </a>`;
      });
      html += `</div>`;
    }
    html += `</div>`;
  }

  rc.innerHTML = html;
}

async function loadGuideResources(guideId, query){
  const el=document.getElementById('guide-resources-'+guideId);
  if(!el)return;
  el.innerHTML=`<div class="space-y-2"><div class="skel h-4 w-full rounded"></div><div class="skel h-4 w-3/4 rounded"></div><div class="skel h-4 w-5/6 rounded"></div><p class="text-[10px]" style="color:var(--fgm)">Searching Wikipedia, Open Library, Semantic Scholar...</p></div>`;

  const results = await API.searchAll(query, ['wikipedia','openlibrary','semanticscholar']);
  let html='';
  const wiki=results.wikipedia||[], ol=results.openlibrary||[], ss=results.semanticscholar||[];

  if(wiki.length){
    html+=`<div class="mb-2"><p class="text-[10px] fd font-semibold mb-1" style="color:#636466"><i class="fa-brands fa-wikipedia-w"></i> Wikipedia</p>`;
    wiki.slice(0,2).forEach(r=>{html+=`<a href="${r.url}" target="_blank" class="block p-1.5 rounded text-[10px] mb-1 rc" style="background:var(--bg3);color:var(--fg);border:1px solid transparent"><strong>${esc(r.title)}</strong><br><span style="color:var(--fgm)">${esc(r.snippet.slice(0,80))}...</span></a>`});
    html+=`</div>`;
  }
  if(ol.length){
    html+=`<div class="mb-2"><p class="text-[10px] fd font-semibold mb-1" style="color:#D97706"><i class="fa-solid fa-book"></i> Open Library</p>`;
    ol.slice(0,2).forEach(r=>{html+=`<a href="${r.url}" target="_blank" class="block p-1.5 rounded text-[10px] mb-1 rc" style="background:var(--bg3);color:var(--fg);border:1px solid transparent">${r.cover?`<img src="${r.cover}" class="w-6 h-8 object-cover rounded inline mr-1" onerror="this.style.display='none'>`:''}<strong>${esc(r.title)}</strong><br><span style="color:var(--fgm)">${esc(r.snippet.slice(0,60))}</span></a>`});
    html+=`</div>`;
  }
  if(ss.length){
    html+=`<div class="mb-2"><p class="text-[10px] fd font-semibold mb-1" style="color:#7C3AED"><i class="fa-solid fa-graduation-cap"></i> Papers</p>`;
    ss.slice(0,2).forEach(r=>{html+=`<a href="${r.url}" target="_blank" class="block p-1.5 rounded text-[10px] mb-1 rc" style="background:var(--bg3);color:var(--fg);border:1px solid transparent"><strong>${esc(r.title.slice(0,50))}</strong>${r.citations?` <span style="color:var(--fgm)">(${r.citations} cit.)</span>`:''}<br><span style="color:var(--fgm)">${esc((r.snippet||'').slice(0,60))}</span></a>`});
    html+=`</div>`;
  }
  if(!html) html=`<p class="text-[10px]" style="color:var(--fgm)">No external resources found.</p>`;

  html+=`<a href="#/discover" class="text-[10px] fd font-medium block mt-1" style="color:var(--acc)">Search more resources &rarr;</a>`;
  el.innerHTML=html;
}

function pGraph(){return `<div class="max-w-7xl mx-auto px-4 py-6"><h1 class="fd font-extrabold text-xl md:text-2xl mb-2" style="color:var(--fg)">Knowledge Graph</h1><p class="text-xs mb-4" style="color:var(--fgm)">Interactive visualization of the prerequisite DAG. Drag to pan, scroll to zoom. Arrows point from prerequisites to advanced guides.</p><div class="rounded-xl overflow-hidden" style="background:var(--card);border:1px solid var(--brd)"><canvas id="gc2" style="width:100%;height:500px;cursor:grab"></canvas></div><div class="mt-3 flex flex-wrap gap-3">${db.d.domains.filter(d=>!d.pid).map(d=>`<span class="flex items-center gap-1.5 text-xs" style="color:var(--fgm)"><span class="w-3 h-3 rounded" style="background:${d.color}"></span>${esc(d.name)}</span>`).join('')}</div></div>`}

function initGC(){const canvas=document.getElementById('gc2');if(!canvas)return;const ctx=canvas.getContext('2d');const dpr=window.devicePixelRatio||1;const rect=canvas.getBoundingClientRect();canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);const W=rect.width,H=rect.height;

const guides=db.d.guides.filter(g=>g.st==='verified'||g.st==='under_review');const nodes=guides.map((g,i)=>{const d=db.gd(g.did);return{id:g.id,title:g.title,lv:g.lv,did:g.did,color:d?.color||'#0891B2',x:100+Math.random()*(W-200),y:60+Math.random()*(H-120),vx:0,vy:0}});
const edges=[];db.d.prereqs.forEach(p=>{const from=nodes.find(n=>n.id===p.rid),to=nodes.find(n=>n.id===p.gid);if(from&&to)edges.push({from,to})});

const nodeMap={};nodes.forEach(n=>nodeMap[n.id]=n);

// Force simulation
let drag=null,panX=0,panY=0,isPanning=false,lastMx=0,lastMy=0,zoom=1;
function sim(){nodes.forEach(n=>{n.vx*=0.9;n.vy*=0.9});
// Repulsion
for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const dx=nodes[j].x-nodes[i].x,dy=nodes[j].y-nodes[i].y,d=Math.max(Math.sqrt(dx*dx+dy*dy),1),f=800/(d*d);nodes[i].vx-=f*dx/d;nodes[i].vy-=f*dy/d;nodes[j].vx+=f*dx/d;nodes[j].vy+=f*dy/d}
// Attraction along edges
edges.forEach(e=>{const dx=e.to.x-e.from.x,dy=e.to.y-e.from.y,d=Math.max(Math.sqrt(dx*dx+dy*dy),1),f=(d-120)*0.005;e.from.vx+=f*dx/d;e.from.vy+=f*dy/d;e.to.vx-=f*dx/d;e.to.vy-=f*dy/d});
// Level constraint (vertical)
nodes.forEach(n=>{const ty=60+n.lv*(H-120)/5;n.vy+=(ty-n.y)*0.01});
// Centering
nodes.forEach(n=>{n.vx+=(W/2-n.x)*0.001;n.vy+=(H/2-n.y)*0.001});
// Update
nodes.forEach(n=>{if(drag&&drag.id===n.id)return;n.x+=n.vx;n.y+=n.vy;n.x=cl(n.x,30,W-30);n.y=cl(n.y,30,H-30)})}

function draw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(panX,panY);ctx.scale(zoom,zoom);
// Edges
edges.forEach(e=>{ctx.beginPath();ctx.moveTo(e.from.x,e.from.y);ctx.lineTo(e.to.x,e.to.y);ctx.strokeStyle='rgba(51,65,85,0.5)';ctx.lineWidth=1.5;ctx.stroke();
// Arrow
const dx=e.to.x-e.from.x,dy=e.to.y-e.from.y,d=Math.max(Math.sqrt(dx*dx+dy*dy),1),ax=e.to.x-dx/d*25,ay=e.to.y-dy/d*25;ctx.beginPath();const angle=Math.atan2(dy,dx);ctx.moveTo(ax,ay);ctx.lineTo(ax-8*Math.cos(angle-0.4),ay-8*Math.sin(angle-0.4));ctx.lineTo(ax-8*Math.cos(angle+0.4),ay-8*Math.sin(angle+0.4));ctx.closePath();ctx.fillStyle='rgba(51,65,85,0.7)';ctx.fill()});
// Nodes
nodes.forEach(n=>{ctx.beginPath();ctx.arc(n.x,n.y,20,0,Math.PI*2);ctx.fillStyle=n.color+'33';ctx.fill();ctx.strokeStyle=n.color;ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px Outfit';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.lv,n.x,n.y);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--fg').trim()||'#F1F5F9';ctx.font='9px Outfit';const t=n.title.length>20?n.title.slice(0,18)+'…':n.title;ctx.fillText(t,n.x,n.y+30)});
ctx.restore()}

function loop(){sim();draw();requestAnimationFrame(loop)}
loop();

canvas.addEventListener('mousedown',e=>{const rect=canvas.getBoundingClientRect();const mx=(e.clientX-rect.left-panX)/zoom,my=(e.clientY-rect.top-panY)/zoom;const hit=nodes.find(n=>{const dx=n.x-mx,dy=n.y-my;return dx*dx+dy*dy<400});if(hit){drag=hit;canvas.style.cursor='grabbing'}else{isPanning=true;lastMx=e.clientX;lastMy=e.clientY;canvas.style.cursor='grabbing'}});
canvas.addEventListener('mousemove',e=>{const rect=canvas.getBoundingClientRect();if(drag){drag.x=cl((e.clientX-rect.left-panX)/zoom,30,W-30);drag.y=cl((e.clientY-rect.top-panY)/zoom,30,H-30);drag.vx=0;drag.vy=0}else if(isPanning){panX+=e.clientX-lastMx;panY+=e.clientY-lastMy;lastMx=e.clientX;lastMy=e.clientY}});
canvas.addEventListener('mouseup',()=>{drag=null;isPanning=false;canvas.style.cursor='grab'});
canvas.addEventListener('mouseleave',()=>{drag=null;isPanning=false});
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom*=e.deltaY>0?0.95:1.05;zoom=cl(zoom,0.3,3)});
canvas.addEventListener('click',e=>{if(drag)return;const rect=canvas.getBoundingClientRect();const mx=(e.clientX-rect.left-panX)/zoom,my=(e.clientY-rect.top-panY)/zoom;const hit=nodes.find(n=>{const dx=n.x-mx,dy=n.y-my;return dx*dx+dy*dy<400});if(hit)nav('#/guide/'+hit.id)})}
}

// ===================== HERO CANVAS =====================
function initHC(){const c=document.getElementById('hc');if(!c)return;const ctx=c.getContext('2d');const dpr=window.devicePixelRatio||1;let w,h;function resize(){w=c.parentElement.offsetWidth;h=c.parentElement.offsetHeight;c.width=w*dpr;c.height=h*dpr;ctx.scale(dpr,dpr)}resize();
const pts=[];for(let i=0;i<60;i++)pts.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.3,vy:(Math.random()-0.5)*0.3,r:Math.random()*2+1});
function draw(){ctx.clearRect(0,0,w,h);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>w)p.vx*=-1;if(p.y<0||p.y>h)p.vy*=-1;ctx.beginPath();ctx.arc(p.x,p.y,Math.max(p.r,0.5),0,Math.PI*2);ctx.fillStyle='rgba(8,145,178,0.25)';ctx.fill()});
for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[j].x-pts[i].x,dy=pts[j].y-pts[i].y,d=Math.sqrt(dx*dx+dy*dy);if(d<150){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle=`rgba(8,145,178,${0.08*(1-d/150)})`;ctx.lineWidth=1;ctx.stroke()}}
requestAnimationFrame(draw)}draw();window.addEventListener('resize',resize)}

A.init();
renderR();
